name: Test

# Every pull request and every push to trunk: build everything and run the tests. No secrets here;
# signing and releasing are the Release workflow's, behind its environment.
on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Built with Xcode 27.2 and its macOS 27.2 SDK, which decides how macOS draws the app (see
    # Scripts/bundle.sh). The xcode-27 image is GitHub's preview of macOS 27 with Xcode 27.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: swift build

      # A test that hangs would hold the job for hours and say nothing. After five minutes this says
      # where the tests are stuck, and fails.
      - name: Run the tests
        run: |
          swift test & tests=$!
          for _ in $(seq 1 60); do kill -0 "$tests" 2>/dev/null || break; sleep 5; done
          if kill -0 "$tests" 2>/dev/null; then
            echo "::error::The tests were still running after five minutes."
            for helper in $(pgrep -f 'swiftpm-testing-helper|xctest'); do sudo sample "$helper" 3 2>/dev/null | sed -n '1,400p'; done
            kill "$tests"
            exit 1
          fi
          wait "$tests"

      # The app as Scripts/bundle.sh packages it, signed ad-hoc (there are no secrets here), and
      # recording the SDK it was built with: that decides how macOS draws it.
      - name: Package the app
        run: |
          Scripts/bundle.sh debug
          sdk="$(vtool -show-build build/Oatcake.app/Contents/MacOS/Oatcake | awk '$1 == "sdk" { print $2; exit }')"
          if [ "$sdk" != "$(xcrun --sdk macosx --show-sdk-version)" ]; then
            echo "::error::The app records SDK $sdk, not the one it was built with."
            exit 1
          fi

      - name: Check the scripts parse
        run: |
          sh -n install.sh
          bash -n Scripts/bundle.sh
          bash -n Scripts/version.sh
